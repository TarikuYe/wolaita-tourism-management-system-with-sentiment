services:
  - type: web
    name: sentiment-api
    env: python
    buildCommand: pip install -r backend/requirements.txt
    startCommand: python -m gunicorn app:app --chdir backend --bind 0.0.0.0:$PORT
    envVars:
      - key: PORT
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.11.0
    healthCheckPath: /health
    plan: free

